name: Build and Publish JARVIS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing JARVIS_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing JARVIS_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing JARVIS_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing JARVIS_KEY_PASSWORD" && exit 1)

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PJARVIS_KEYSTORE_FILE="$RUNNER_TEMP/jarvis-release.jks" \
            -PJARVIS_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
            -PJARVIS_KEY_ALIAS="$KEY_ALIAS" \
            -PJARVIS_KEY_PASSWORD="$KEY_PASSWORD"

          cp app/build/outputs/apk/release/app-release.apk JARVIS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || (echo "Could not read versionName" && exit 1)
          TAG="v$VERSION_NAME"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "JARVIS $TAG" \
              --notes "Atualização oficial do JARVIS."
          fi

          gh release upload "$TAG" JARVIS.apk --clobber
